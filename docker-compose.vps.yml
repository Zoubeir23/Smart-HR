volumes:
  vps_postgres_data: {}
  vps_redis_data: {}
  vps_django_media: {}

networks:
  dokploy-network:
    external: true

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    build:
      context: ./Backend
      dockerfile: ./compose/production/postgres/Dockerfile
    image: smart_hr_vps_postgres
    volumes:
      - vps_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: unless-stopped

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    volumes:
      - vps_redis_data:/data
    restart: unless-stopped

  # ─── Backend Django (Gunicorn) ───────────────────────────────────────────────
  django: &django
    build:
      context: ./Backend
      dockerfile: ./compose/production/django/Dockerfile
    image: smart_hr_vps_django
    volumes:
      - vps_django_media:/app/smart_hr/media
    depends_on:
      - postgres
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ADMIN_URL=${DJANGO_ADMIN_URL}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - DJANGO_SECURE_SSL_REDIRECT=${DJANGO_SECURE_SSL_REDIRECT}
      - DJANGO_SECURE_HSTS_SECONDS=${DJANGO_SECURE_HSTS_SECONDS}
      - DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS=${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS}
      - DJANGO_SECURE_HSTS_PRELOAD=${DJANGO_SECURE_HSTS_PRELOAD}
      - DJANGO_SERVER_EMAIL=${DJANGO_SERVER_EMAIL}
      - DJANGO_ACCOUNT_ALLOW_REGISTRATION=${DJANGO_ACCOUNT_ALLOW_REGISTRATION}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY}
      - REDIS_URL=${REDIS_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DJANGO_DEFAULT_FROM_EMAIL=${DJANGO_DEFAULT_FROM_EMAIL}
      - CELERY_FLOWER_USER=${CELERY_FLOWER_USER}
      - CELERY_FLOWER_PASSWORD=${CELERY_FLOWER_PASSWORD}
      - SITE_URL=${SITE_URL}
      - SENTRY_DSN=${SENTRY_DSN}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command: /start
    restart: unless-stopped

  # ─── Celery Worker ──────────────────────────────────────────────────────────
  celeryworker:
    <<: *django
    image: smart_hr_vps_celeryworker
    command: /start-celeryworker

  # ─── Frontend React + nginx ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: ./Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_SITE_URL: https://smart-hr.tech
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
    image: smart_hr_vps_frontend
    networks:
      - default
      - dokploy-network
    expose:
      - "80"
    depends_on:
      - django
    restart: unless-stopped
