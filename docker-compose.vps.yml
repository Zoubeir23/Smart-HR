volumes:
  vps_postgres_data: {}
  vps_redis_data: {}
  vps_django_media: {}
  vps_minio_data: {}

networks:
  dokploy-network:
    external: true

services:
  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    build:
      context: ./Backend
      dockerfile: ./compose/production/postgres/Dockerfile
    image: smart_hr_vps_postgres
    volumes:
      - vps_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: unless-stopped

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    volumes:
      - vps_redis_data:/data
    restart: unless-stopped

  # ─── Backend Django (Gunicorn) ───────────────────────────────────────────────
  django: &django
    build:
      context: ./Backend
      dockerfile: ./compose/production/django/Dockerfile
    image: smart_hr_vps_django
    volumes:
      - vps_django_media:/app/smart_hr/media
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_ADMIN_URL=${DJANGO_ADMIN_URL}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - DJANGO_SECURE_SSL_REDIRECT=${DJANGO_SECURE_SSL_REDIRECT}
      - DJANGO_SECURE_HSTS_SECONDS=${DJANGO_SECURE_HSTS_SECONDS}
      - DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS=${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS}
      - DJANGO_SECURE_HSTS_PRELOAD=${DJANGO_SECURE_HSTS_PRELOAD}
      - DJANGO_SERVER_EMAIL=${DJANGO_SERVER_EMAIL}
      - DJANGO_ACCOUNT_ALLOW_REGISTRATION=${DJANGO_ACCOUNT_ALLOW_REGISTRATION}
      - DJANGO_PASSWORD_RESET_TIMEOUT=${DJANGO_PASSWORD_RESET_TIMEOUT}
      - DJANGO_JWT_COOKIE_SECURE=${DJANGO_JWT_COOKIE_SECURE}
      - DJANGO_DEMO_PASSWORD=${DJANGO_DEMO_PASSWORD}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET}
      - WEB_CONCURRENCY=${WEB_CONCURRENCY}
      - REDIS_URL=${REDIS_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DJANGO_DEFAULT_FROM_EMAIL=${DJANGO_DEFAULT_FROM_EMAIL}
      - CELERY_FLOWER_USER=${CELERY_FLOWER_USER}
      - CELERY_FLOWER_PASSWORD=${CELERY_FLOWER_PASSWORD}
      - SITE_URL=${SITE_URL}
      - SENTRY_DSN=${SENTRY_DSN}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - MINIO_STORAGE_ENABLED=${MINIO_STORAGE_ENABLED}
      - MINIO_ENDPOINT_URL=${MINIO_ENDPOINT_URL}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
    command: /start
    restart: unless-stopped

  # ─── Celery Worker ──────────────────────────────────────────────────────────
  celeryworker:
    <<: *django
    image: smart_hr_vps_celeryworker
    command: /start-celeryworker

  # ─── MinIO (S3-compatible storage) ─────────────────────────────────────────
  minio:
    image: minio/minio:latest
    volumes:
      - vps_minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    networks:
      - default
      - dokploy-network
    expose:
      - "9000"
      - "9001"
    restart: unless-stopped

  # ─── MinIO Init (crée le bucket au premier démarrage) ───────────────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY;
      mc mb --ignore-existing myminio/$$MINIO_BUCKET_NAME;
      mc anonymous set public myminio/$$MINIO_BUCKET_NAME;
      exit 0;
      "
    environment:
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
    restart: on-failure

  # ─── Frontend React + nginx ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      dockerfile: ./Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_SITE_URL: https://smart-hr.tech
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
    image: smart_hr_vps_frontend
    networks:
      - default
      - dokploy-network
    expose:
      - "80"
    depends_on:
      - django
    restart: unless-stopped
