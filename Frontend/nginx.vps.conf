server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (SPA + routes sans add_header enfant) ──────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;


    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff
        font/woff2;

    # ── Block path-traversal and scanner probes ──────────────────────────────
    location ~* /\.(env|aws|git|ssh|htpasswd|npmrc|dockerenv|DS_Store) {
        return 404;
    }
    location ~* /(wp-admin|wp-login|phpMyAdmin|phpmyadmin|xmlrpc\.php) {
        return 404;
    }

    # ── Dynamic DNS resolution (re-resolve docker service IPs every 30s) ────
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_django http://django:5000;

    # ── Proxy API calls to Django backend ────────────────────────────────────
    # proxy_hide_header strips Django's own X-Frame-Options before Nginx adds
    # its own — prevents duplicate conflicting headers reaching the client.
    location /api/ {
        proxy_pass $backend_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        client_max_body_size 50M;
    }

    # ── Proxy Django admin ───────────────────────────────────────────────────
    location /admin/ {
        proxy_pass $backend_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
    }

    # ── Static assets — cache 1 an ───────────────────────────────────────────
    # Nginx ne hérite pas des add_header parents quand un bloc enfant définit
    # son propre add_header — on réplique explicitement les security headers.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        access_log off;
    }

    location = /favicon.ico { log_not_found off; access_log off; }

    location = /robots.txt  {
        add_header Content-Type text/plain;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        log_not_found off;
        access_log off;
    }

    # ── React SPA — toutes les routes inconnues → index.html ─────────────────
    # La Content-Security-Policy est déclarée ICI et pas au niveau `server` :
    # une CSP ne gouverne que le document HTML qui exécute le JavaScript, et ce
    # document n'est servi que par ce bloc. La poser au niveau `server` la
    # ferait aussi s'ajouter aux réponses proxifiées de /admin/, qui portent
    # déjà la CSP de Django : le navigateur applique alors l'intersection des
    # deux, ce qui bloquerait les scripts inline dont l'admin Django a besoin.
    #
    # Django pose bien une CSP, mais seulement sur ses réponses API (JSON), où
    # elle ne protège rien. C'est ce bloc-ci qui compte.
    #
    # Enjeu concret : les jetons JWT vivent en localStorage, donc lisibles par
    # tout script injecté. Cette CSP est la barrière qui rend cette exposition
    # acceptable, en empêchant l'exécution de scripts non prévus.
    #
    # Origines autorisées, toutes vérifiées comme réellement utilisées :
    #   accounts.google.com  → @react-oauth/google (script + iframe de connexion)
    #   fonts.googleapis.com → feuille de style Google Fonts (index.html)
    #   fonts.gstatic.com    → fichiers de police
    #   *.ingest*.sentry.io  → envoi des erreurs Sentry
    #   'self'               → l'API, servie en same-origin via le proxy /api/
    # 'unsafe-inline' n'est mis que sur style-src (styles inline de Tailwind et
    # framer-motion) ; script-src n'en a pas besoin, le build Vite ne produit
    # aucun script inline — vérifié sur dist/index.html.
    #
    # Nginx n'hérite pas des add_header parents dès qu'un bloc enfant en définit
    # un : les quatre en-têtes du niveau server sont donc répliqués ici.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://accounts.google.com https://*.ingest.sentry.io https://*.ingest.de.sentry.io; frame-src https://accounts.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
}
