server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Block path-traversal probes — return 404 immediately
    location ~* /\.(env|aws|git|ssh|htpasswd|npmrc|dockerenv) {
        return 404;
    }
    location ~* /(wp-admin|wp-login|phpMyAdmin|phpmyadmin|\.well-known/acme-challenge) {
        return 404;
    }

    # Proxy API calls to Django backend
    location /api/ {
        proxy_pass http://django:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # Proxy Django admin
    location /admin/ {
        proxy_pass http://django:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React SPA — all unknown routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  {
        add_header Content-Type text/plain;
        log_not_found off;
        access_log off;
    }
}
