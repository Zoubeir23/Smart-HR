server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (SPA + routes sans add_header enfant) ──────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff
        font/woff2;

    # ── Block path-traversal and scanner probes ──────────────────────────────
    location ~* /\.(env|aws|git|ssh|htpasswd|npmrc|dockerenv|DS_Store) {
        return 404;
    }
    location ~* /(wp-admin|wp-login|phpMyAdmin|phpmyadmin|xmlrpc\.php) {
        return 404;
    }

    # ── Proxy API calls to Django backend ────────────────────────────────────
    # proxy_hide_header strips Django's own X-Frame-Options before Nginx adds
    # its own — prevents duplicate conflicting headers reaching the client.
    location /api/ {
        proxy_pass http://django:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
        client_max_body_size 50M;
    }

    # ── Proxy Django admin ───────────────────────────────────────────────────
    location /admin/ {
        proxy_pass http://django:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Frame-Options;
    }

    # ── Static assets — cache 1 an ───────────────────────────────────────────
    # Nginx ne hérite pas des add_header parents quand un bloc enfant définit
    # son propre add_header — on réplique explicitement les security headers.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        access_log off;
    }

    location = /favicon.ico { log_not_found off; access_log off; }

    location = /robots.txt  {
        add_header Content-Type text/plain;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        log_not_found off;
        access_log off;
    }

    # ── React SPA — toutes les routes inconnues → index.html ─────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
