site_name: Smart-HR Docs
site_description: Documentation officielle et technique du SIRH Smart-HR
site_author: Smart-HR Team

theme:
  name: material
  language: fr
  palette:
    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Passer en mode sombre
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Passer en mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight

docs_dir: Docs

nav:
  - Accueil: index.md
  - Guide Utilisateur:
    - Espace Employé: user-guide/employee.md
    - Espace Manager / RH: user-guide/hr-manager.md
    - Administration: user-guide/admin.md
  - Documentation Technique:
    - Architecture Système: Architecture/ARCHITECTURE.md
    - Déploiement Docker: Deployment/DOCKER_SETUP.md
    - Matrice de Sécurité (RBAC): Security/RBAC_MATRIX.md
  - API Reference:
    - Auth Login: api-reference/auth_login.md
    - Auth Refresh: api-reference/auth_refresh.md
    - Auth Verify: api-reference/auth_verify.md
    - Auth Logout: api-reference/auth_logout.md
    - Users Profile: api-reference/users_profile.md
    - Users List: api-reference/users_list.md
    - Personnel Employees: api-reference/personnel_employees.md
    - Personnel Departments: api-reference/personnel_departments.md
    - Leaves Requests: api-reference/conge_requests.md
    - Leaves Approve: api-reference/conge_approve.md
    - Leaves Reject: api-reference/conge_reject.md
    - Leaves Balance: api-reference/conge_balance.md
    - AI Churn Predict: api-reference/ai_churn-predict.md
    - Recruitment Jobs: api-reference/recruitment_jobs.md
    - Recruitment Apply: api-reference/recruitment_apply.md
    - Recruitment Candidates: api-reference/recruitment_candidates.md
    - Payroll Payslips: api-reference/payroll_payslips.md
    - Payroll Generate: api-reference/payroll_generate.md
    - Tasks List: api-reference/tasks_list.md
    - Tasks Assign: api-reference/tasks_assign.md
    - Attendance Clock In: api-reference/attendance_clock-in.md
    - Attendance Clock Out: api-reference/attendance_clock-out.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
