<!doctype html><html><head><meta charset="utf-8"><title>Logo</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--bg);font-family:var(--font-sans);display:flex;gap:32px;align-items:center;flex-wrap:wrap;}
  .block{display:flex;align-items:center;gap:10px;}
  .mark{width:40px;height:40px;border-radius:10px;background:#FFF3E0;position:relative;border:1px solid var(--border);}
  .mark.red{background:#D62828;border-color:#D62828;}
  .mark svg{position:absolute;inset:0;}
  .word{font-size:20px;font-weight:800;letter-spacing:-.02em;}
  .word b{color:#D62828;}
  .caption{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-subtle);margin-top:8px;display:block;}
  .item{text-align:center;}
</style></head><body>
<div class="item">
  <div class="block">
    <div class="mark red">
      <svg viewBox="0 0 48 48" width="40" height="40"><rect x="12" y="14" width="6" height="20" rx="3" fill="white" fill-opacity="0.95"/><rect x="21" y="10" width="6" height="24" rx="3" fill="white"/><rect x="30" y="14" width="6" height="20" rx="3" fill="white" fill-opacity="0.95"/><rect x="12" y="22" width="24" height="2" rx="1" fill="white" fill-opacity="0.8"/></svg>
    </div>
    <div class="word">Smart<b>-HR</b></div>
  </div>
  <span class="caption">Lockup · full</span>
</div>
<div class="item">
  <div class="mark red" style="width:56px;height:56px">
    <svg viewBox="0 0 48 48" width="56" height="56"><rect x="12" y="14" width="6" height="20" rx="3" fill="white" fill-opacity="0.95"/><rect x="21" y="10" width="6" height="24" rx="3" fill="white"/><rect x="30" y="14" width="6" height="20" rx="3" fill="white" fill-opacity="0.95"/><rect x="12" y="22" width="24" height="2" rx="1" fill="white" fill-opacity="0.8"/></svg>
  </div>
  <span class="caption">Icon only</span>
</div>
<div class="item">
  <div class="word" style="font-size:28px">Smart<b>-HR</b></div>
  <span class="caption">Wordmark</span>
</div>
</body></html>
