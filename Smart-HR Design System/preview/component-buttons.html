<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Buttons</title>
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        font-family: var(--font-sans);
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 10px;
      }

      button {
        font-family: inherit;
        cursor: pointer;
        border: 0;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        transition: all .15s;
      }

      .primary {
        background: linear-gradient(135deg, #D62828, #e63c3c);
        color: #fff;
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 14px;
        box-shadow: var(--shadow-sm);
      }

      .primary:hover {
        filter: brightness(1.08);
        box-shadow: var(--shadow-md);
      }

      .cream {
        background: #FFF3E0;
        color: #c41e1e;
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 14px;
        border: 1px solid var(--border);
      }

      .outline {
        background: #fff;
        color: var(--fg);
        border: 1px solid var(--border);
        padding: 9px 16px;
        border-radius: 10px;
        font-size: 13px;
      }

      .outline:hover {
        border-color: rgba(214, 40, 40, .3);
      }

      .ghost {
        background: transparent;
        color: var(--fg-muted);
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 13px;
      }

      .ghost:hover {
        background: hsl(36 40% 91%);
        color: var(--fg);
      }

      .xl {
        font-size: 16px;
        padding: 14px 28px;
        border-radius: 14px;
        font-weight: 700;
      }

      .sm {
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 8px;
      }

      .destructive {
        background: #D62828;
        color: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <button class="primary xl">Demander une démo →</button>
      <button class="outline xl">▷ Voir la démo</button>
    </div>
    <div class="row">
      <button class="primary">+ Nouvel employé</button>
      <button class="cream">Se connecter</button>
      <button class="outline">📄 Exporter</button>
      <button class="ghost">Annuler</button>
    </div>
    <div class="row">
      <button class="primary sm">Valider</button>
      <button class="destructive sm">✕ Refuser</button>
      <button class="outline sm">Détails ›</button>
    </div>
  </body>
</html>
