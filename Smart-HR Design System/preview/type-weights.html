<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Weights</title>
        <link rel="stylesheet" href="../colors_and_type.css">
        <style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-sans);}
  .row{display:flex;gap:18px;align-items:baseline;padding:6px 0;}
  .tag{flex:0 0 110px;font-size:11px;color:var(--fg-muted);font-family:ui-monospace,Menlo,monospace;}
  .ex{font-size:22px;color:var(--fg);}
        </style>
    </head>
    <body>
        <div class="row">
            <div class="tag">400 Regular</div>
            <div class="ex" style="font-weight:400">Plus Jakarta Sans</div>
        </div>
        <div class="row">
            <div class="tag">500 Medium</div>
            <div class="ex" style="font-weight:500">Plus Jakarta Sans</div>
        </div>
        <div class="row">
            <div class="tag">600 Semibold</div>
            <div class="ex" style="font-weight:600">Plus Jakarta Sans</div>
        </div>
        <div class="row">
            <div class="tag">700 Bold</div>
            <div class="ex" style="font-weight:700">Plus Jakarta Sans</div>
        </div>
        <div class="row">
            <div class="tag">800 Extrabold</div>
            <div class="ex" style="font-weight:800;letter-spacing:-.02em">Plus Jakarta Sans</div>
        </div>
    </body>
</html>
