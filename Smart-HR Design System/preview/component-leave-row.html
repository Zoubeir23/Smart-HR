<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Leave row</title>
        <link rel="stylesheet" href="../colors_and_type.css">
        <style>body{margin:0;padding:18px;background:var(--bg);font-family:var(--font-sans);}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow-sm);}
  .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .hd .t{display:flex;align-items:center;gap:8px;}
  .hd .t .ic{width:28px;height:28px;border-radius:8px;background:rgba(214,40,40,.10);color:#D62828;display:flex;align-items:center;justify-content:center;}
  .hd h4{margin:0;font-size:14px;font-weight:600;}
  .count{background:hsl(36 40% 91%);color:var(--fg);font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;}
  .row{display:flex;align-items:center;justify-content:space-between;padding:10px;border-radius:10px;background:hsl(36 40% 94%);margin-bottom:6px;}
  .row:hover{background:hsl(36 40% 91%);}
  .ldesc{display:flex;align-items:center;gap:10px;min-width:0;}
  .emoji{font-size:18px;}
  .n{font-size:13px;font-weight:600;color:var(--fg);}
  .m{font-size:11px;color:var(--fg-muted);}
  .actions{display:flex;gap:6px;}
  .btn{width:26px;height:26px;border-radius:7px;border:0;cursor:pointer;font-size:13px;}
  .no{background:rgba(214,40,40,.10);color:#c41e1e;}
  .yes{background:rgba(22,163,74,.10);color:hsl(160 84% 28%);}
        </style>
    </head>
    <body>
        <div class="card">
            <div class="hd">
                <div class="t">
                    <div class="ic">📅</div>
                    <h4>Congés en attente</h4>
                </div>
                <span class="count">3</span>
            </div>
            <div class="row">
                <div class="ldesc">
                    <span class="emoji">🏖️</span>
                    <div>
                        <div class="n">Amadou Sow</div>
                        <div class="m">Vacances · 10 juin — 17 juin</div>
                    </div>
                </div>
                <div class="actions">
                    <button class="btn no">✕</button>
                    <button class="btn yes">✓</button>
                </div>
            </div>
            <div class="row">
                <div class="ldesc">
                    <span class="emoji">🤒</span>
                    <div>
                        <div class="n">Fatou Ndiaye</div>
                        <div class="m">Maladie · 4 juin</div>
                    </div>
                </div>
                <div class="actions">
                    <button class="btn no">✕</button>
                    <button class="btn yes">✓</button>
                </div>
            </div>
            <div class="row">
                <div class="ldesc">
                    <span class="emoji">👶</span>
                    <div>
                        <div class="n">Aïssa Diop</div>
                        <div class="m">Maternité · 1 sept — 1 déc</div>
                    </div>
                </div>
                <div class="actions">
                    <button class="btn no">✕</button>
                    <button class="btn yes">✓</button>
                </div>
            </div>
        </div>
    </body>
</html>
