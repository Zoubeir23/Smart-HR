<!doctype html><html><head><meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-sans);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-muted);margin-bottom:6px;}
  .field{position:relative;}
  .field .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--fg-subtle);font-size:14px;}
  input{width:100%;height:42px;border:1px solid var(--border);border-radius:10px;background:#fff;font-family:inherit;font-size:14px;padding:0 12px 0 36px;box-sizing:border-box;color:var(--fg);}
  input:focus{outline:none;border-color:#D62828;box-shadow:0 0 0 3px hsl(0 68% 50% / .08);}
  input[disabled]{background:hsl(36 40% 91%);color:var(--fg-muted);}
  .search{background:hsl(36 40% 91%);}
  select{height:42px;width:100%;border:1px solid var(--border);border-radius:10px;padding:0 12px;font-family:inherit;font-size:14px;background:#fff;color:var(--fg);}
</style></head><body>
<div class="grid">
  <div><label>Adresse email</label><div class="field"><span class="ico">✉</span><input placeholder="votre@email.com" value="rh@smarthr.com"></div></div>
  <div><label>Mot de passe</label><div class="field"><span class="ico">🔒</span><input type="password" value="••••••••"></div></div>
  <div><label>Recherche</label><div class="field"><span class="ico">🔍</span><input class="search" placeholder="Rechercher employés, documents..."></div></div>
  <div><label>Département</label><select><option>Ingénierie</option><option>RH</option></select></div>
</div>
</body></html>
