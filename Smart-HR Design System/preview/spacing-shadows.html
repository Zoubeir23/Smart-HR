<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Shadows</title>
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      body {
        margin: 0;
        padding: 28px;
        background: var(--bg);
        font-family: var(--font-sans);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 18px;
      }

      .cell {
        text-align: center;
      }

      .box {
        width: 84px;
        height: 60px;
        margin: 0 auto 10px;
        background: #fff;
        border-radius: 10px;
        border: 1px solid var(--border);
      }

      .lbl {
        font-size: 11px;
        font-weight: 700;
        color: var(--fg);
      }

      .val {
        font-size: 9px;
        color: var(--fg-muted);
        font-family: ui-monospace, Menlo, monospace;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="cell">
        <div class="box" style="box-shadow:var(--shadow-sm)"></div>
        <div class="lbl">shadow-sm</div>
        <div class="val">rgb(80 30 10 / .06)</div>
      </div>
      <div class="cell">
        <div class="box" style="box-shadow:var(--shadow-md)"></div>
        <div class="lbl">shadow-md</div>
        <div class="val">warm 8px</div>
      </div>
      <div class="cell">
        <div class="box" style="box-shadow:var(--shadow-lg)"></div>
        <div class="lbl">shadow-lg</div>
        <div class="val">warm 20px</div>
      </div>
      <div class="cell">
        <div class="box" style="box-shadow:var(--shadow-glow)"></div>
        <div class="lbl">shadow-glow</div>
        <div class="val">red, focus/CTA</div>
      </div>
    </div>
  </body>
</html>
