<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Spacing</title>
        <link rel="stylesheet" href="../colors_and_type.css">
        <style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-sans);}
  .row{display:flex;align-items:center;gap:14px;padding:4px 0;}
  .tag{flex:0 0 80px;font-size:10px;font-family:ui-monospace,Menlo,monospace;color:var(--fg-muted);}
  .bar{height:14px;background:linear-gradient(90deg,#D62828,#e86060);border-radius:3px;}
  .px{margin-left:10px;font-size:10px;color:var(--fg-muted);font-family:ui-monospace,Menlo,monospace;}
        </style>
    </head>
    <body>
        <div class="row">
            <div class="tag">space-1</div>
            <div class="bar" style="width:4px"></div>
            <span class="px">4px · 0.25rem</span>
        </div>
        <div class="row">
            <div class="tag">space-2</div>
            <div class="bar" style="width:8px"></div>
            <span class="px">8px</span>
        </div>
        <div class="row">
            <div class="tag">space-3</div>
            <div class="bar" style="width:12px"></div>
            <span class="px">12px</span>
        </div>
        <div class="row">
            <div class="tag">space-4</div>
            <div class="bar" style="width:16px"></div>
            <span class="px">16px · 1rem base</span>
        </div>
        <div class="row">
            <div class="tag">space-6</div>
            <div class="bar" style="width:24px"></div>
            <span class="px">24px · card p-6</span>
        </div>
        <div class="row">
            <div class="tag">space-8</div>
            <div class="bar" style="width:32px"></div>
            <span class="px">32px</span>
        </div>
        <div class="row">
            <div class="tag">space-12</div>
            <div class="bar" style="width:48px"></div>
            <span class="px">48px</span>
        </div>
        <div class="row">
            <div class="tag">space-16</div>
            <div class="bar" style="width:64px"></div>
            <span class="px">64px · section pad</span>
        </div>
        <div class="row">
            <div class="tag">space-24</div>
            <div class="bar" style="width:96px"></div>
            <span class="px">96px · py-24 hero</span>
        </div>
    </body>
</html>
