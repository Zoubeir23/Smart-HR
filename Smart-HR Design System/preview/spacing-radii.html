<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Radii</title>
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        font-family: var(--font-sans);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
      }

      .cell {
        background: #fff;
        border: 1px solid var(--border);
        padding: 10px;
        text-align: center;
      }

      .box {
        width: 60px;
        height: 60px;
        margin: 0 auto 8px;
        background: linear-gradient(135deg, #D62828, #e63c3c);
      }

      .lbl {
        font-size: 10px;
        font-weight: 700;
        color: var(--fg);
      }

      .val {
        font-size: 10px;
        color: var(--fg-muted);
        font-family: ui-monospace, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="cell">
        <div class="box" style="border-radius:4px"></div>
        <div class="lbl">sm</div>
        <div class="val">4px</div>
      </div>
      <div class="cell">
        <div class="box" style="border-radius:6px"></div>
        <div class="lbl">md</div>
        <div class="val">6px</div>
      </div>
      <div class="cell">
        <div class="box" style="border-radius:8px"></div>
        <div class="lbl">lg · base</div>
        <div class="val">8px</div>
      </div>
      <div class="cell">
        <div class="box" style="border-radius:12px"></div>
        <div class="lbl">xl</div>
        <div class="val">12px</div>
      </div>
      <div class="cell">
        <div class="box" style="border-radius:16px"></div>
        <div class="lbl">2xl</div>
        <div class="val">16px</div>
      </div>
      <div class="cell">
        <div class="box" style="border-radius:24px"></div>
        <div class="lbl">3xl</div>
        <div class="val">24px</div>
      </div>
      <div class="cell">
        <div class="box" style="border-radius:999px"></div>
        <div class="lbl">full</div>
        <div class="val">pills</div>
      </div>
      <div class="cell">
        <div class="box" style="border-radius:10px"></div>
        <div class="lbl">logo</div>
        <div class="val">10px</div>
      </div>
      <div class="cell">
        <div class="box" style="border-radius:8px 8px 0 0"></div>
        <div class="lbl">top-only</div>
        <div class="val">kpi bar</div>
      </div>
      <div class="cell">
        <div class="box" style="border-radius:2px"></div>
        <div class="lbl">hairline</div>
        <div class="val">2px</div>
      </div>
    </div>
  </body>
</html>
