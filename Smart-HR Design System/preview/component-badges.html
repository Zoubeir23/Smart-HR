<!doctype html><html><head><meta charset="utf-8"><title>Badges</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:20px;background:var(--bg);font-family:var(--font-sans);}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .b{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid;}
  .active{background:rgba(22,163,74,.10);color:hsl(160,84%,28%);border-color:rgba(22,163,74,.15);}
  .pending{background:rgba(234,88,12,.10);color:hsl(25,95%,38%);border-color:rgba(234,88,12,.15);}
  .inactive{background:rgba(214,40,40,.10);color:#c41e1e;border-color:rgba(214,40,40,.15);}
  .outline{background:#fff;color:var(--fg-muted);border-color:var(--border);}
  .count{background:#D62828;color:#fff;border-color:#D62828;padding:2px 7px;min-width:18px;justify-content:center;}
  .ai{background:linear-gradient(135deg,#6366f1,#2563eb);color:#fff;border-color:transparent;}
  h4{margin:0 0 6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--fg-subtle);}
</style></head><body>
<h4>Status</h4>
<div class="row"><span class="b active">● Actif</span><span class="b pending">● En attente</span><span class="b inactive">● Inactif</span><span class="b outline">Brouillon</span></div>
<h4>Counts &amp; AI</h4>
<div class="row"><span class="b count">3</span><span class="b count">12</span><span class="b ai">✦ IA</span><span class="b outline">Nouveau</span></div>
<h4>Leave types</h4>
<div class="row"><span class="b outline">🏖️ Vacances</span><span class="b outline">🤒 Maladie</span><span class="b outline">👶 Maternité</span><span class="b outline">👤 Personnel</span></div>
</body></html>
