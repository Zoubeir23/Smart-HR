<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Gradients</title>
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }

      .card {
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid var(--border);
        background: #fff;
      }

      .band {
        height: 78px;
        display: flex;
        align-items: flex-end;
        padding: 10px 12px;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .04em;
      }

      .meta {
        padding: 8px 12px;
        font-size: 10px;
        color: var(--fg-muted);
        font-family: ui-monospace, Menlo, monospace;
      }

      .meta b {
        display: block;
        font-family: var(--font-sans);
        font-size: 11px;
        color: var(--fg);
        margin-bottom: 2px;
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="card">
        <div class="band"
             style="background:linear-gradient(135deg,#D62828 0%,#e63c3c 100%)">PRIMARY</div>
        <div class="meta">
          <b>--gradient-primary</b>#D62828 → #e63c3c
        </div>
      </div>
      <div class="card">
        <div class="band"
             style="background:linear-gradient(135deg,#D62828 0%,#c41e1e 100%)">ACCENT</div>
        <div class="meta">
          <b>--gradient-accent</b>#D62828 → #c41e1e
        </div>
      </div>
      <div class="card">
        <div class="band"
             style="background:linear-gradient(135deg,#FFF3E0 0%,#ffe0b2 100%);
                    color:#c41e1e">WARM</div>
        <div class="meta">
          <b>--gradient-warm</b>#FFF3E0 → #ffe0b2
        </div>
      </div>
      <div class="card">
        <div class="band"
             style="background:linear-gradient(135deg,hsl(160 84% 28%) 0%,hsl(172 66% 35%) 100%)">SUCCESS</div>
        <div class="meta">
          <b>--gradient-success</b>teal run
        </div>
      </div>
      <div class="card">
        <div class="band"
             style="background:linear-gradient(180deg,#ffffff 0%,#FFF3E0 100%);
                    color:#1c1410">CARD</div>
        <div class="meta">
          <b>--gradient-card</b>white → cream
        </div>
      </div>
      <div class="card">
        <div class="band"
             style="background:linear-gradient(180deg,#08111e 0%,#0a1628 50%,#07101c 100%)">SIDEBAR</div>
        <div class="meta">
          <b>--gradient-sidebar</b>navy 3-stop
        </div>
      </div>
    </div>
  </body>
</html>
