<!doctype html><html><head><meta charset="utf-8"><title>Palette</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px;background:var(--bg);}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}
  .sw{border-radius:10px;overflow:hidden;border:1px solid var(--border);background:#fff;}
  .chip{height:56px;display:flex;align-items:flex-end;padding:8px;color:#fff;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
  .meta{padding:8px 10px;font-size:10px;line-height:1.3;}
  .meta b{display:block;font-size:11px;font-weight:700;color:var(--fg);letter-spacing:-.01em;text-transform:none;}
  .meta span{color:var(--fg-muted);font-family:ui-monospace,Menlo,monospace;}
</style></head><body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#FFF3E0;color:#c41e1e">CREAM</div><div class="meta"><b>Primary</b><span>#FFF3E0</span></div></div>
  <div class="sw"><div class="chip" style="background:#D62828">RED</div><div class="meta"><b>Secondary</b><span>#D62828</span></div></div>
  <div class="sw"><div class="chip" style="background:#c41e1e">DARK</div><div class="meta"><b>Red dark</b><span>#c41e1e</span></div></div>
  <div class="sw"><div class="chip" style="background:#e86060">LIGHT</div><div class="meta"><b>Red light</b><span>#e86060</span></div></div>
  <div class="sw"><div class="chip" style="background:#08111e">NAVY</div><div class="meta"><b>Sidebar</b><span>#08111e</span></div></div>
  <div class="sw"><div class="chip" style="background:#1c1410">INK</div><div class="meta"><b>Foreground</b><span>#1c1410</span></div></div>
</div>
</body></html>
