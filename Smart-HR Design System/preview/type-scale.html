<!doctype html><html><head><meta charset="utf-8"><title>Type scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:18px 22px;background:var(--bg);}
  .row{display:flex;align-items:baseline;gap:14px;padding:6px 0;border-bottom:1px dashed var(--border);}
  .row:last-child{border-bottom:0}
  .tag{flex:0 0 74px;font-size:10px;color:var(--fg-muted);font-family:ui-monospace,Menlo,monospace;}
  .ex{color:var(--fg);letter-spacing:-.015em;font-family:var(--font-sans);}
</style></head><body>
<div class="row"><div class="tag">72 · 800</div><div class="ex" style="font-size:48px;font-weight:800;letter-spacing:-.03em;line-height:1.05">Le futur des RH</div></div>
<div class="row"><div class="tag">36 · 800</div><div class="ex" style="font-size:30px;font-weight:800">L'IA au service de vos talents</div></div>
<div class="row"><div class="tag">24 · 700</div><div class="ex" style="font-size:22px;font-weight:700">Risque de turnover</div></div>
<div class="row"><div class="tag">18 · 600</div><div class="ex" style="font-size:17px;font-weight:600">Congés en attente</div></div>
<div class="row"><div class="tag">14 · 500</div><div class="ex" style="font-size:14px;font-weight:500;color:var(--fg-muted)">Voici un résumé de l'activité RH de votre organisation</div></div>
</body></html>
