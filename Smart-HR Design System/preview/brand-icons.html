<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Iconography</title>
    <link rel="stylesheet" href="../colors_and_type.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      body {
        margin: 0;
        padding: 18px;
        background: var(--bg);
        font-family: var(--font-sans);
      }

      .row {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 10px;
      }

      .c {
        aspect-ratio: 1;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }

      .c i {
        color: #D62828;
      }

      .c span {
        font-size: 9px;
        color: var(--fg-muted);
      }

      h4 {
        margin: 0 0 8px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .12em;
        color: var(--fg-subtle);
      }
    </style>
  </head>
  <body>
    <h4>Lucide icons · production set</h4>
    <div class="row">
      <div class="c">
        <i data-lucide="layout-dashboard"></i><span>dashboard</span>
      </div>
      <div class="c">
        <i data-lucide="users"></i><span>users</span>
      </div>
      <div class="c">
        <i data-lucide="calendar"></i><span>calendar</span>
      </div>
      <div class="c">
        <i data-lucide="clipboard-list"></i><span>tasks</span>
      </div>
      <div class="c">
        <i data-lucide="clock"></i><span>clock</span>
      </div>
      <div class="c">
        <i data-lucide="credit-card"></i><span>payroll</span>
      </div>
      <div class="c">
        <i data-lucide="file-text"></i><span>docs</span>
      </div>
      <div class="c">
        <i data-lucide="graduation-cap"></i><span>training</span>
      </div>
      <div class="c">
        <i data-lucide="briefcase"></i><span>jobs</span>
      </div>
      <div class="c">
        <i data-lucide="bar-chart-3"></i><span>charts</span>
      </div>
      <div class="c">
        <i data-lucide="message-square"></i><span>chat</span>
      </div>
      <div class="c">
        <i data-lucide="mic"></i><span>voice</span>
      </div>
      <div class="c">
        <i data-lucide="settings"></i><span>settings</span>
      </div>
      <div class="c">
        <i data-lucide="shield"></i><span>security</span>
      </div>
      <div class="c">
        <i data-lucide="sparkles"></i><span>AI</span>
      </div>
      <div class="c">
        <i data-lucide="bell"></i><span>notif</span>
      </div>
      <div class="c">
        <i data-lucide="search"></i><span>search</span>
      </div>
      <div class="c">
        <i data-lucide="trending-down"></i><span>churn</span>
      </div>
      <div class="c">
        <i data-lucide="user-search"></i><span>recruit</span>
      </div>
      <div class="c">
        <i data-lucide="bot"></i><span>bot</span>
      </div>
    </div>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
