<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Eyebrows</title>
    <link rel="stylesheet" href="../colors_and_type.css" />
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: var(--bg);
        font-family: var(--font-sans);
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 14px;
      }

      .eb {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .12em;
        color: var(--fg-subtle);
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .12em;
        background: rgba(214, 40, 40, .10);
        color: #c41e1e;
        border: 1px solid rgba(214, 40, 40, .20);
      }

      .micro {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .12em;
        color: #D62828;
      }

      h3 {
        margin: 0 0 6px;
        font-size: 12px;
        font-weight: 700;
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <h3>Eyebrows (10px, UPPERCASE, tracking-widest)</h3>
    <div class="row">
      <span class="eb">Collaborateurs actifs</span><span class="eb">Accès démo</span><span class="eb">Disponibilité</span>
    </div>
    <h3>Pills</h3>
    <div class="row">
      <span class="pill">✦ Intelligence Artificielle RH</span><span class="pill"
      style="background:hsl(36 40% 91%);
             color:hsl(20 12% 45%);
             border-color:var(--border)">Plateforme SIRH Intelligent</span>
    </div>
    <h3>Micro-labels (11px, colored)</h3>
    <div class="row">
      <span class="micro">En savoir plus →</span><span class="micro" style="color:hsl(160 84% 28%)">SLA 99.9% Garanti</span>
    </div>
  </body>
</html>
