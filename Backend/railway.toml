[build]
builder = "DOCKERFILE"
dockerfilePath = "compose/production/django/Dockerfile"

# Railway injecte $PORT dynamiquement — on override le CMD du Dockerfile
# L'ENTRYPOINT existant (/entrypoint) s'exécute toujours avant : il construit DATABASE_URL
# et attend que PostgreSQL soit prêt via wait-for-it.
[deploy]
startCommand = "python manage.py migrate --no-input && python manage.py collectstatic --no-input && gunicorn config.wsgi --bind 0.0.0.0:$PORT --chdir=/app --workers 2 --timeout 120"
healthcheckPath = "/api/v1/auth/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
