volumes:
  smart_hr_local_postgres_data: {}
  smart_hr_local_postgres_data_backups: {}
  smart_hr_local_redis_data: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: smart_hr_local_django
    container_name: smart_hr_local_django
    depends_on:
      - postgres
      - redis
      - mailpit
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: smart_hr_production_postgres
    container_name: smart_hr_local_postgres
    volumes:
      - smart_hr_local_postgres_data:/var/lib/postgresql/data
      - smart_hr_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres

  mailpit:
    image: docker.io/axllent/mailpit:latest
    container_name: smart_hr_local_mailpit
    ports:
      - "8025:8025"

  redis:
    image: docker.io/redis:7.2
    container_name: smart_hr_local_redis
    volumes:
      - smart_hr_local_redis_data:/data

  celeryworker:
    <<: *django
    image: smart_hr_local_celeryworker
    container_name: smart_hr_local_celeryworker
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celeryworker

  celerybeat:
    <<: *django
    image: smart_hr_local_celerybeat
    container_name: smart_hr_local_celerybeat
    depends_on:
      - redis
      - postgres
      - mailpit
    ports: []
    command: /start-celerybeat

  flower:
    <<: *django
    image: smart_hr_local_flower
    container_name: smart_hr_local_flower
    ports:
      - '5555:5555'
    command: /start-flower

  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile.local
    image: smart_hr_local_frontend
    container_name: smart_hr_local_frontend
    volumes:
      - ../Frontend:/app:z
      - /app/node_modules
    ports:
      - '5173:5173'
    depends_on:
      - django
    environment:
      - VITE_API_URL=http://localhost:8000
