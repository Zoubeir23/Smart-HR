<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>
      {% block email_title %}
        Smart-HR
      {% endblock email_title %}
    </title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #eef0f3;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
        color: #0f172a;
      }

      .email-outer {
        background-color: #eef0f3;
        padding: 2rem 1rem;
      }

      .email-wrapper {
        max-width: 600px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 16px rgba(15, 23, 42, 0.10), 0 1px 3px rgba(15, 23, 42, 0.06);
      }

      /* ── Header ── */
      .email-header {
        background: #ffffff;
        padding: 1.75rem 2.5rem;
        text-align: center;
        border-bottom: 3px solid #D62828;
      }

      /* ── Body ── */
      .email-content {
        padding: 2.25rem 2.5rem 2rem;
        background: #ffffff;
      }

      .email-title {
        font-size: 1.3rem;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 0.55rem;
        line-height: 1.3;
      }

      .email-subtitle {
        font-size: 0.875rem;
        color: #64748b;
        margin-bottom: 1.5rem;
        line-height: 1.7;
      }

      /* ── Info card ── */
      .credentials-card {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 1.5rem;
        margin: 1.5rem 0;
      }

      .credentials-title {
        font-size: 0.68rem;
        font-weight: 700;
        color: #475569;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        margin-bottom: 1rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid #e2e8f0;
      }

      .credential-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.8rem 0.9rem;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        margin-bottom: 0.6rem;
      }

      .credential-row:last-child {
        margin-bottom: 0;
      }

      .credential-icon {
        width: 32px;
        height: 32px;
        min-width: 32px;
        background: #0f172a;
        border-radius: 7px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 800;
        color: #ffffff;
        flex-shrink: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0;
      }

      .credential-icon.red {
        background: #D62828;
      }

      .credential-icon.green {
        background: #16a34a;
      }

      .credential-icon.amber {
        background: #d97706;
      }

      .credential-icon.blue {
        background: #1d4ed8;
      }

      .credential-label {
        font-size: 0.65rem;
        font-weight: 600;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 2px;
      }

      .credential-value {
        font-size: 0.875rem;
        font-weight: 600;
        color: #0f172a;
      }

      .credential-value.monospace {
        font-family: 'Courier New', 'Lucida Console', monospace;
        color: #D62828;
        letter-spacing: 0.08em;
      }

      /* ── Alerts ── */
      .alert {
        padding: 0.9rem 1.1rem;
        border-radius: 8px;
        margin: 1.25rem 0;
        font-size: 0.845rem;
        line-height: 1.6;
        border-left: 3px solid transparent;
      }

      .alert-warning {
        background: #fef2f2;
        border-left-color: #D62828;
        color: #7f1d1d;
      }

      .alert-warning strong {
        color: #D62828;
      }

      .alert-success {
        background: #f0fdf4;
        border-left-color: #16a34a;
        color: #14532d;
      }

      .alert-success strong {
        color: #16a34a;
      }

      .alert-neutral {
        background: #f8fafc;
        border-left-color: #94a3b8;
        color: #475569;
      }

      .alert-amber {
        background: #fffbeb;
        border-left-color: #d97706;
        color: #78350f;
      }

      .alert-amber strong {
        color: #d97706;
      }

      /* ── Status badges ── */
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.3rem 0.8rem;
        border-radius: 999px;
        font-size: 0.775rem;
        font-weight: 700;
        letter-spacing: 0.015em;
      }

      .status-approved {
        background: #dcfce7;
        color: #15803d;
        border: 1px solid #bbf7d0;
      }

      .status-rejected {
        background: #fee2e2;
        color: #b91c1c;
        border: 1px solid #fecaca;
      }

      /* ── Feature list ── */
      .feature-list {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        padding: 1.5rem;
        margin: 1.5rem 0;
      }

      .feature-list-title {
        font-size: 0.68rem;
        font-weight: 700;
        color: #475569;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        margin-bottom: 1rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid #e2e8f0;
      }

      .feature-item {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        margin-bottom: 0.85rem;
      }

      .feature-item:last-child {
        margin-bottom: 0;
      }

      .feature-dot {
        width: 22px;
        height: 22px;
        min-width: 22px;
        background: #0f172a;
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 800;
        color: #ffffff;
        margin-top: 1px;
      }

      .feature-text-title {
        font-size: 0.855rem;
        font-weight: 600;
        color: #0f172a;
        margin-bottom: 0.15rem;
      }

      .feature-text-desc {
        font-size: 0.79rem;
        color: #64748b;
        line-height: 1.5;
      }

      /* ── Divider ── */
      .divider {
        height: 1px;
        background: #e2e8f0;
        margin: 1.75rem 0;
      }

      /* ── CTA button ── */
      .btn-wrapper {
        text-align: center;
        margin: 1.75rem 0;
      }

      .btn {
        display: inline-block;
        background: #D62828;
        color: #ffffff !important;
        font-size: 0.855rem;
        font-weight: 700;
        text-decoration: none;
        padding: 0.8rem 2rem;
        border-radius: 8px;
        letter-spacing: 0.01em;
      }

      /* ── Footer ── */
      .email-footer {
        padding: 1.25rem 2.5rem;
        background: #0f172a;
        text-align: center;
        border-top: 2px solid #D62828;
      }

      .footer-brand {
        font-size: 0.78rem;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.65);
        letter-spacing: 0.02em;
        margin-bottom: 0.35rem;
      }

      .footer-brand span {
        color: #D62828;
      }

      .footer-text {
        font-size: 0.7rem;
        color: rgba(255, 255, 255, 0.28);
        line-height: 1.6;
      }

      .footer-text a {
        color: rgba(255, 255, 255, 0.35);
        text-decoration: none;
      }

      /* ── Responsive ── */
      @media only screen and (max-width: 600px) {
        .email-wrapper {
          border-radius: 0;
        }

        .email-content {
          padding: 1.5rem;
        }

        .credentials-card {
          padding: 1.1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="email-outer">
      <div class="email-wrapper">
        <!-- Header -->
        <div class="email-header">
          <img src="{{ site_url }}/static/images/logo.svg"
               width="160"
               height="38"
               alt="Smart-HR"
               style="display:block;
                      margin:0 auto" />
        </div>
        <!-- Content -->
        <div class="email-content">
          {% block email_content %}
          {% endblock email_content %}
        </div>
        <!-- Footer -->
        <div class="email-footer">
          <div class="footer-brand">
            Smart<span>-HR</span>
          </div>
          <div class="footer-text">
            © {% now "Y" %} Smart-HR · Votre SIRH Intelligent
            <br />
            <a href="{{ site_url }}">{{ site_url }}</a>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
