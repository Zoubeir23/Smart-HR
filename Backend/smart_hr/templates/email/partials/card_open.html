{% comment %}
  Ouvre une carte de détails (table). À refermer avec card_close.html.
  Usage : {% include "email/partials/card_open.html" with card_title="Détails" %}
{% endcomment %}
<table role="presentation"
       width="100%"
       cellpadding="0"
       cellspacing="0"
       border="0"
       style="width:100%; margin:0 0 20px; border:1px solid #e5dccc; border-radius:12px; background-color:#ffffff;">
  <tr>
    <td style="padding:20px;">
      {% if card_title %}
        <p style="margin:0 0 14px; padding:0 0 12px; border-bottom:1px solid #e5dccc; font-size:14px; font-weight:700; color:#1c1410;">
          {{ card_title }}
        </p>
      {% endif %}
      <table role="presentation"
             width="100%"
             cellpadding="0"
             cellspacing="0"
             border="0"
             style="width:100%;">
