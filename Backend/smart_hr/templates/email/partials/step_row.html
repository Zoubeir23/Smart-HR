{% comment %}
  Une étape numérotée.
  Usage : {% include "email/partials/step_row.html" with number="1" step_title="..." desc="..." %}
{% endcomment %}
<tr>
  <td width="28"
      valign="top"
      style="width:28px; padding:0 12px 14px 0;">
    <table role="presentation"
           cellpadding="0"
           cellspacing="0"
           border="0">
      <tr>
        <td width="24"
            height="24"
            align="center"
            bgcolor="#1c1410"
            style="width:24px; height:24px; border-radius:12px; font-size:12px; font-weight:700; color:#ffffff;">
          {{ number }}
        </td>
      </tr>
    </table>
  </td>
  <td valign="top" style="padding:0 0 14px;">
    <p style="margin:0 0 2px; font-size:14px; font-weight:700; color:#1c1410;">{{ step_title }}</p>
    <p style="margin:0; font-size:12px; line-height:1.5; color:#816e65;">{{ desc }}</p>
  </td>
</tr>
