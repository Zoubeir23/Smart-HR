{% comment %}
  Une étape numérotée. La pastille du numéro est en rouge braise : la séquence
  est une action à mener, pas de la décoration.
  Usage : {% include "email/partials/step_row.html" with number="1" step_title="..." desc="..." %}
{% endcomment %}
<tr>
  <td width="30" valign="top" style="width:30px; padding:0 14px 18px 0;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td width="26"
            height="26"
            align="center"
            bgcolor="#d62828"
            style="width:26px;
                   height:26px;
                   border-radius:12px;
                   font-size:12px;
                   font-weight:700;
                   color:#ffffff">{{ number }}</td>
      </tr>
    </table>
  </td>
  <td valign="top" style="padding:0 0 18px;">
    <p style="margin:0 0 3px;
              font-size:14px;
              font-weight:700;
              color:#1c1410">{{ step_title }}</p>
    <p style="margin:0; font-size:12px; line-height:1.6; color:#816e65;">{{ desc }}</p>
  </td>
</tr>
