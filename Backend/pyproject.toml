[project]
name = "smart-hr"
version = "0.1.0"
description = "SaaS SIRH Intelligent pour PME Africaines"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Zoubeir Ibrahima Amed", email = "Zoubeiribrahima@gmail.com" },
]
requires-python = "==3.13.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "anthropic>=0.40.0",
  "argon2-cffi==25.1.0",
  "celery==5.6.2",
  "crispy-bootstrap5==2026.3",
  "dj-rest-auth>=6.0.0",
  "django==6.0.3",
  "django-allauth[mfa,socialaccount]==65.15.0",
  "django-anymail==14.0",
  "django-celery-beat==2.9.0",
  "django-cors-headers>=4.3.0",
  "django-crispy-forms==2.6",
  "django-environ==0.13.0",
  "django-model-utils==5.0.0",
  "django-redis==6.0.0",
  "djangorestframework>=3.15.0",
  "djangorestframework-simplejwt>=5.3.0",
  "flower==2.0.1",
  "google-genai>=1.0.0",
  "gunicorn==25.1.0",
  "hiredis==3.3.0",
  "joblib>=1.4.0",
  "numpy>=1.26.0",
  "openai>=1.30.0",
  "pandas>=2.2.0",
  "pillow==12.1.1",
  "psycopg[c]==3.3.3",
  "pypdf2>=3.0.0",
  "python-slugify==8.0.4",
  "qdrant-client>=1.9.0",
  "python-magic==0.4.27",
  "redis==7.3.0",
  "scikit-learn>=1.5.0",
  "sentry-sdk[django]==2.29.1",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "coverage==7.13.4",
  "django-coverage-plugin==3.2.0",
  "django-debug-toolbar==6.2.0",
  "django-extensions==4.1",
  "django-stubs[compatible-mypy]==5.2.9",
  "djlint==1.36.4",
  "factory-boy==3.3.3",
  "ipdb==0.13.13",
  "mypy==1.19.1",
  "pre-commit==4.5.1",
  "psycopg[c]==3.3.3",
  "pytest==9.0.2",
  "pytest-django==4.12.0",
  "pytest-sugar==1.1.1",
  "ruff==0.15.6",
  "sphinx==9.1.0",
  "sphinx-autobuild==2025.8.25",
  "watchfiles==1.1.1",
  "werkzeug[watchdog]==3.1.6",
]

[tool.ruff]
line-length = 130
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "../Smart-HR Design System/**",
  "staticfiles/*",
]
lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  # Exception handling style preferences — intentional patterns in this codebase
  "BLE001",  # Blind exception (used for resilience in external calls)
  # Formatter conflict — ruff docs recommend ignoring COM812 when using ruff format
  "COM812",
  "DTZ011",  # datetime.date.today() without timezone
  "E741",    # Ambiguous variable name (l, O, I)
  "EM101",   # Exception with string literal (intentional for readability)
  "EM102",   # Exception with f-string
  "ERA001",  # Found commented-out code
  "N806",    # Variable in function should be lowercase
  "PIE794",  # Class definition with duplicate literal
  # Import style
  "PLC0415", # Import not at top-level (lazy imports for circular import avoidance)
  "PLR0913", # Too many arguments (complex API views)
  # Code style
  "PLR2004", # Magic value comparison (used for HTTP status codes)
  # Path style
  "PTH122",  # os.path.splitext → Path.suffix
  "PTH123",  # open() → Path.open()
  "RUF012",  # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",    # Use of assert detected
  "S110",    # try-except-pass (used for optional feature detection)
  # Random
  "S311",    # Standard random for non-security use
  "SIM102",  # sometimes it's better to nest
  "SIM105",  # Use contextlib.suppress
  "TRY003",  # Long messages in raise (French error messages)
  "TRY300",  # Consider moving return into else
  "TRY400",  # Use logging.exception instead of logging.error
]
lint.isort.force-single-line = true

[tool.pyproject-fmt]
keep_full_version = true

[tool.pytest]
# ==== pytest ====
ini_options.minversion = "6.0"
ini_options.addopts = "--ds=config.settings.test --reuse-db --import-mode=importlib"
ini_options.python_files = [
  "tests.py",
  "test_*.py",
]

[tool.coverage]
# ==== Coverage ====
run.include = [ "smart_hr/**" ]
run.omit = [ "*/migrations/*", "*/tests/*" ]
run.plugins = [ "django_coverage_plugin" ]

# ==== mypy ====
[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
  "mypy_django_plugin.main",
]
overrides = [
  # Django migrations should not produce any errors:
  { module = "*.migrations.*", ignore_errors = true },
]

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
close_void_tags = true
format_css = true
format_js = true
# TODO: remove T002 when fixed https://github.com/djlint/djLint/issues/687
ignore = "H006,H021,H030,H031,T002"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"
css.indent_size = 2
js.indent_size = 2
